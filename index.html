<script>
  const STAGES = ['Preparo do Material', 'Montagem', 'Soldagem', 'Acabamento', 'Pintura', 'Conclusão'];
  let activities = [];

  async function loadData() {
    try {
      const res = await fetch('/api/activities');
      if (res.ok) {
        activities = await res.json();
        render();
        document.getElementById('syncBadge').innerHTML = `
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>PostgreSQL (Neon) Ativo</span>
        `;
      }
    } catch (err) {
      console.error("Erro ao conectar com a API:", err);
    }
  }

  async function createActivity(data) {
    await fetch('/api/activities', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'CREATE', ...data })
    });
    loadData();
  }

  async function updateStage(id, newStage) {
    await fetch('/api/activities', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'UPDATE_STAGE', id, stage: newStage })
    });
    loadData();
  }

  async function deleteActivity(id) {
    await fetch('/api/activities', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'DELETE', id })
    });
    loadData();
  }

  function render() {
    const cols = {
      'Preparo do Material': document.getElementById('col-preparo'),
      'Montagem': document.getElementById('col-montagem'),
      'Soldagem': document.getElementById('col-soldagem'),
      'Acabamento': document.getElementById('col-acabamento'),
      'Pintura': document.getElementById('col-pintura'),
      'Conclusão': document.getElementById('col-conclusao')
    };

    Object.values(cols).forEach(col => { if(col) col.innerHTML = ''; });
    const counts = { 'Preparo do Material': 0, 'Montagem': 0, 'Soldagem': 0, 'Acabamento': 0, 'Pintura': 0, 'Conclusão': 0 };

    activities.forEach(act => {
      counts[act.stage] = (counts[act.stage] || 0) + 1;
      const card = document.createElement('div');
      card.className = 'bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition';
      
      const idx = STAGES.indexOf(act.stage);

      card.innerHTML = `
        <div class="flex justify-between items-start">
          <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">${act.code}</span>
          <span class="text-[10px] font-bold text-amber-600">${act.priority}</span>
        </div>
        <h4 class="font-bold text-slate-800 text-sm mt-1.5">${act.name}</h4>
        <p class="text-xs text-slate-500">${act.client || 'Sem cliente'}</p>
        <div class="flex justify-between items-center mt-3 pt-2 border-t border-slate-100">
          <button class="btn-del text-xs text-red-500 hover:text-red-700 font-medium" data-id="${act.id}">Excluir</button>
          <div class="flex space-x-1">
            ${idx > 0 ? `<button class="btn-prev p-1 rounded bg-slate-100 hover:bg-slate-200 text-xs font-bold" data-id="${act.id}">←</button>` : ''}
            ${idx < STAGES.length - 1 ? `<button class="btn-next p-1 rounded bg-masiTeal text-white text-xs font-bold" data-id="${act.id}">→</button>` : ''}
          </div>
        </div>
      `;

      if (cols[act.stage]) cols[act.stage].appendChild(card);
    });

    document.querySelectorAll('.btn-del').forEach(b => {
      b.onclick = () => deleteActivity(b.dataset.id);
    });
    document.querySelectorAll('.btn-prev').forEach(b => {
      b.onclick = () => {
        const act = activities.find(a => a.id === b.dataset.id);
        if (act) {
          const curr = STAGES.indexOf(act.stage);
          if (curr > 0) updateStage(act.id, STAGES[curr - 1]);
        }
      };
    });
    document.querySelectorAll('.btn-next').forEach(b => {
      b.onclick = () => {
        const act = activities.find(a => a.id === b.dataset.id);
        if (act) {
          const curr = STAGES.indexOf(act.stage);
          if (curr < STAGES.length - 1) updateStage(act.id, STAGES[curr + 1]);
        }
      };
    });

    document.getElementById('cnt-preparo').innerText = counts['Preparo do Material'];
    document.getElementById('cnt-montagem').innerText = counts['Montagem'];
    document.getElementById('cnt-soldagem').innerText = counts['Soldagem'];
    document.getElementById('cnt-acabamento').innerText = counts['Acabamento'];
    document.getElementById('cnt-pintura').innerText = counts['Pintura'];
    document.getElementById('cnt-conclusao').innerText = counts['Conclusão'];

    const total = activities.length;
    const pct = total > 0 ? Math.round((counts['Conclusão'] / total) * 100) : 0;
    document.getElementById('cnt-total').innerText = pct + '%';
    document.getElementById('bar-progress').style.width = pct + '%';

    if (window.lucide) window.lucide.createIcons();
  }

  const modal = document.getElementById('taskModal');
  document.getElementById('btnNewActivity').onclick = () => { modal.classList.remove('hidden'); modal.classList.add('flex'); };
  document.getElementById('btnCloseModal').onclick = () => { modal.classList.add('hidden'); modal.classList.remove('flex'); };
  document.getElementById('btnCancelModal').onclick = () => { modal.classList.add('hidden'); modal.classList.remove('flex'); };

  document.getElementById('activityForm').onsubmit = async (e) => {
    e.preventDefault();
    await createActivity({
      name: document.getElementById('itemName').value,
      code: document.getElementById('itemCode').value,
      client: document.getElementById('clientName').value,
      stage: document.getElementById('stageSelect').value,
      priority: document.getElementById('prioritySelect').value
    });
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    e.target.reset();
  };

  loadData();
  setInterval(loadData, 3000); // Sincroniza a cada 3 segundos com o banco do Neon
</script>
