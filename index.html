<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MASITECH INSTALLATION — Painel de Produção</title>
  
  <!-- Remove o erro 404 do Favicon -->
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            masiNavy: '#0F2A4A',
            masiTeal: '#1F8394'
          }
        }
      }
    }
  </script>

  <style>
    .kanban-col { min-width: 270px; max-width: 320px; }
    .custom-scroll::-webkit-scrollbar { height: 8px; width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- CABEÇALHO -->
  <header class="bg-masiNavy text-white shadow-lg border-b-4 border-masiTeal sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div>
          <h1 class="text-xl font-bold tracking-wide text-white leading-none">MASITECH INSTALLATION</h1>
          <p class="text-xs text-teal-200 mt-1">Painel de Produção (PostgreSQL Neon)</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <div id="syncBadge" class="flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Sincronizado</span>
        </div>

        <button id="btnNewActivity" class="flex items-center space-x-2 bg-masiTeal hover:bg-teal-600 text-white px-4 py-2 rounded-lg font-medium text-sm transition shadow">
          <span>+ Nova Atividade</span>
        </button>
      </div>
    </div>
  </header>

  <!-- PAINEL PRINCIPAL -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 space-y-6">
    <!-- MÉTRICAS -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-7 gap-3">
      <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-200 border-l-4 border-l-amber-500">
        <p class="text-xs text-slate-500 font-semibold uppercase">Preparo</p>
        <p id="cnt-preparo" class="text-2xl font-bold text-slate-800 mt-1">0</p>
      </div>
      <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-200 border-l-4 border-l-blue-500">
        <p class="text-xs text-slate-500 font-semibold uppercase">Montagem</p>
        <p id="cnt-montagem" class="text-2xl font-bold text-slate-800 mt-1">0</p>
      </div>
      <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-200 border-l-4 border-l-indigo-500">
        <p class="text-xs text-slate-500 font-semibold uppercase">Soldagem</p>
        <p id="cnt-soldagem" class="text-2xl font-bold text-slate-800 mt-1">0</p>
      </div>
      <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-200 border-l-4 border-l-purple-500">
        <p class="text-xs text-slate-500 font-semibold uppercase">Acabamento</p>
        <p id="cnt-acabamento" class="text-2xl font-bold text-slate-800 mt-1">0</p>
      </div>
      <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-200 border-l-4 border-l-sky-500">
        <p class="text-xs text-slate-500 font-semibold uppercase">Pintura</p>
        <p id="cnt-pintura" class="text-2xl font-bold text-slate-800 mt-1">0</p>
      </div>
      <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-200 border-l-4 border-l-emerald-500">
        <p class="text-xs text-slate-500 font-semibold uppercase">Conclusão</p>
        <p id="cnt-conclusao" class="text-2xl font-bold text-slate-800 mt-1">0</p>
      </div>
      <div class="col-span-2 lg:col-span-1 bg-masiNavy text-white rounded-xl p-3 shadow-sm flex flex-col justify-between">
        <p class="text-xs text-teal-300 font-semibold uppercase">Progresso</p>
        <div>
          <p id="cnt-total" class="text-2xl font-bold mt-0.5">0%</p>
          <div class="w-full bg-slate-700 h-1.5 rounded-full mt-2 overflow-hidden">
            <div id="bar-progress" class="bg-masiTeal h-full w-0 transition-all duration-500"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- KANBAN -->
    <div class="flex gap-4 overflow-x-auto pb-4 custom-scroll items-start">
      <div class="kanban-col flex-1 bg-slate-200/60 rounded-xl p-3 border border-slate-300">
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-amber-300">
          <span class="font-bold text-xs uppercase text-amber-800">1. Preparo Material</span>
        </div>
        <div id="col-preparo" class="space-y-3 min-h-[300px]"></div>
      </div>

      <div class="kanban-col flex-1 bg-slate-200/60 rounded-xl p-3 border border-slate-300">
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-blue-300">
          <span class="font-bold text-xs uppercase text-blue-800">2. Montagem</span>
        </div>
        <div id="col-montagem" class="space-y-3 min-h-[300px]"></div>
      </div>

      <div class="kanban-col flex-1 bg-slate-200/60 rounded-xl p-3 border border-slate-300">
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-indigo-300">
          <span class="font-bold text-xs uppercase text-indigo-800">3. Soldagem</span>
        </div>
        <div id="col-soldagem" class="space-y-3 min-h-[300px]"></div>
      </div>

      <div class="kanban-col flex-1 bg-slate-200/60 rounded-xl p-3 border border-slate-300">
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-purple-300">
          <span class="font-bold text-xs uppercase text-purple-800">4. Acabamento</span>
        </div>
        <div id="col-acabamento" class="space-y-3 min-h-[300px]"></div>
      </div>

      <div class="kanban-col flex-1 bg-slate-200/60 rounded-xl p-3 border border-slate-300">
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-sky-300">
          <span class="font-bold text-xs uppercase text-sky-800">5. Pintura</span>
        </div>
        <div id="col-pintura" class="space-y-3 min-h-[300px]"></div>
      </div>

      <div class="kanban-col flex-1 bg-slate-200/60 rounded-xl p-3 border border-slate-300">
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-emerald-300">
          <span class="font-bold text-xs uppercase text-emerald-800">6. Conclusão</span>
        </div>
        <div id="col-conclusao" class="space-y-3 min-h-[300px]"></div>
      </div>
    </div>
  </main>

  <!-- MODAL DE ATIVIDADE -->
  <div id="taskModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full overflow-hidden">
      <div class="bg-masiNavy p-4 text-white flex justify-between items-center">
        <h3 class="font-bold text-lg">Nova Atividade</h3>
        <button id="btnCloseModal" class="text-slate-300 hover:text-white text-xl">&times;</button>
      </div>
      <form id="activityForm" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Nome do Item / Estrutura</label>
          <input type="text" id="itemName" required placeholder="Ex: Painel de Alumínio Tipo A" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-masiTeal outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Código / ID</label>
            <input type="text" id="itemCode" required placeholder="Ex: MST-001" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-masiTeal outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Cliente / Obra</label>
            <input type="text" id="clientName" placeholder="Ex: Obra Ville" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-masiTeal outline-none">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Etapa Inicial</label>
            <select id="stageSelect" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-masiTeal outline-none">
              <option value="Preparo do Material">1. Preparo Material</option>
              <option value="Montagem">2. Montagem</option>
              <option value="Soldagem">3. Soldagem</option>
              <option value="Acabamento">4. Acabamento</option>
              <option value="Pintura">5. Pintura</option>
              <option value="Conclusão">6. Conclusão</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Prioridade</label>
            <select id="prioritySelect" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-masiTeal outline-none">
              <option value="Baixa">Baixa</option>
              <option value="Média" selected>Média</option>
              <option value="Alta">Alta</option>
            </select>
          </div>
        </div>
        <div class="flex justify-end space-x-3 pt-4 border-t border-slate-200">
          <button type="button" id="btnCancelModal" class="px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-100 text-sm font-medium">Cancelar</button>
          <button type="submit" class="px-5 py-2 rounded-lg bg-masiTeal hover:bg-teal-600 text-white font-medium text-sm shadow">Salvar no Postgres</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STAGES = ['Preparo do Material', 'Montagem', 'Soldagem', 'Acabamento', 'Pintura', 'Conclusão'];
    let activities = [];

    async function loadData() {
      try {
        const res = await fetch('/api/activities');
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) {
            activities = data;
            render();
          }
        }
      } catch (err) {
        console.error("Erro ao carregar dados da API:", err);
      }
    }

    async function createActivity(data) {
      await fetch('/api/activities', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'CREATE', ...data })
      });
      loadData();
    }

    async function updateStage(id, newStage) {
      await fetch('/api/activities', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'UPDATE_STAGE', id, stage: newStage })
      });
      loadData();
    }

    async function deleteActivity(id) {
      await fetch('/api/activities', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'DELETE', id })
      });
      loadData();
    }

    function render() {
      const cols = {
        'Preparo do Material': document.getElementById('col-preparo'),
        'Montagem': document.getElementById('col-montagem'),
        'Soldagem': document.getElementById('col-soldagem'),
        'Acabamento': document.getElementById('col-acabamento'),
        'Pintura': document.getElementById('col-pintura'),
        'Conclusão': document.getElementById('col-conclusao')
      };

      Object.values(cols).forEach(col => { if (col) col.innerHTML = ''; });
      const counts = { 'Preparo do Material': 0, 'Montagem': 0, 'Soldagem': 0, 'Acabamento': 0, 'Pintura': 0, 'Conclusão': 0 };

      activities.forEach(act => {
        counts[act.stage] = (counts[act.stage] || 0) + 1;
        const
