<script>
  const STAGES = ['Preparo do Material', 'Montagem', 'Soldagem', 'Acabamento', 'Pintura', 'Conclusão'];
  let activities = [];

  // 1. CARREGAR DADOS DA API NEON/VERCEL
  async function loadData() {
    try {
      const res = await fetch('/api/activities');
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data)) {
          activities = data;
          render();
        }
      }
    } catch (err) {
      console.error("Erro ao carregar da API:", err);
    }
  }

  // 2. AÇÕES DE CRIAR, MOVER E EXCLUIR
  async function createActivity(data) {
    try {
      await fetch('/api/activities', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'CREATE', ...data })
      });
      loadData();
    } catch (err) {
      console.error("Erro ao criar atividade:", err);
    }
  }

  async function updateStage(id, newStage) {
    try {
      await fetch('/api/activities', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'UPDATE_STAGE', id, stage: newStage })
      });
      loadData();
    } catch (err) {
      console.error("Erro ao mover etapa:", err);
    }
  }

  async function deleteActivity(id) {
    try {
      await fetch('/api/activities', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'DELETE', id })
      });
      loadData();
    } catch (err) {
      console.error("Erro ao excluir atividade:", err);
    }
  }

  // 3. RENDERIZAR O KANBAN E BINDAR BOTÕES DOS CARDS
  function render() {
    const cols = {
      'Preparo do Material': document.getElementById('col-preparo'),
      'Montagem': document.getElementById('col-montagem'),
      'Soldagem': document.getElementById('col-soldagem'),
      'Acabamento': document.getElementById('col-acabamento'),
      'Pintura': document.getElementById('col-pintura'),
      'Conclusão': document.getElementById('col-conclusao')
    };

    Object.values(cols).forEach(col => { if (col) col.innerHTML = ''; });
    const counts = { 'Preparo do Material': 0, 'Montagem': 0, 'Soldagem': 0, 'Acabamento': 0, 'Pintura': 0, 'Conclusão': 0 };

    activities.forEach(act => {
      counts[act.stage] = (counts[act.stage] || 0) + 1;
      const card = document.createElement('div');
      card.className = 'bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition';
      
      const idx = STAGES.indexOf(act.stage);

      card.innerHTML = `
        <div class="flex justify-between items-start">
          <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">${act.code || 'MST'}</span>
          <span class="text-[10px] font-bold text-amber-600">${act.priority || 'Média'}</span>
        </div>
        <h4 class="font-bold text-slate-800 text-sm mt-1.5">${act.name}</h4>
        <p class="text-xs text-slate-500">${act.client || 'Sem cliente'}</p>
        <div class="flex justify-between items-center mt-3 pt-2 border-t border-slate-100">
          <button onclick="window.handleDelete('${act.id}')" class="text-xs text-red-500 hover:text-red-700 font-medium">Excluir</button>
          <div class="flex space-x-1">
            ${idx > 0 ? `<button onclick="window.handleMove('${act.id}', -1)" class="p-1 rounded bg-slate-100 hover:bg-slate-200 text-xs font-bold">←</button>` : ''}
            ${idx < STAGES.length - 1 ? `<button onclick="window.handleMove('${act.id}', 1)" class="p-1 rounded bg-masiTeal text-white text-xs font-bold">→</button>` : ''}
          </div>
        </div>
      `;

      if (cols[act.stage]) cols[act.stage].appendChild(card);
    });

    // Atualização dos contadores superiores
    const elPreparo = document.getElementById('cnt-preparo');
    const elMontagem = document.getElementById('cnt-montagem');
    const elSoldagem = document.getElementById('cnt-soldagem');
    const elAcabamento = document.getElementById('cnt-acabamento');
    const elPintura = document.getElementById('cnt-pintura');
    const elConclusao = document.getElementById('cnt-conclusao');

    if (elPreparo) elPreparo.innerText = counts['Preparo do Material'];
    if (elMontagem) elMontagem.innerText = counts['Montagem'];
    if (elSoldagem) elSoldagem.innerText = counts['Soldagem'];
    if (elAcabamento) elAcabamento.innerText = counts['Acabamento'];
    if (elPintura) elPintura.innerText = counts['Pintura'];
    if (elConclusao) elConclusao.innerText = counts['Conclusão'];

    const total = activities.length;
    const pct = total > 0 ? Math.round((counts['Conclusão'] / total) * 100) : 0;
    const elTotal = document.getElementById('cnt-total');
    const elBar = document.getElementById('bar-progress');
    if (elTotal) elTotal.innerText = pct + '%';
    if (elBar) elBar.style.width = pct + '%';

    if (window.lucide) window.lucide.createIcons();
  }

  // 4. HANDLERS GLOBAIS DE MANEIRA DIRETA
  window.handleDelete = function(id) {
    deleteActivity(id);
  };

  window.handleMove = function(id, direction) {
    const act = activities.find(a => a.id === id);
    if (act) {
      const curr = STAGES.indexOf(act.stage);
      const next = curr + direction;
      if (next >= 0 && next < STAGES.length) {
        updateStage(id, STAGES[next]);
      }
    }
  };

  // 5. EVENTOS DO MODAL E INICIALIZAÇÃO
  window.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById('taskModal');
    const btnNew = document.getElementById('btnNewActivity');
    const btnClose = document.getElementById('btnCloseModal');
    const btnCancel = document.getElementById('btnCancelModal');
    const form = document.getElementById('activityForm');

    const openModal = () => {
      if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }
    };

    const closeModal = () => {
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    };

    if (btnNew) btnNew.addEventListener('click', openModal);
    if (btnClose) btnClose.addEventListener('click', closeModal);
    if (btnCancel) btnCancel.addEventListener('click', closeModal);

    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        await createActivity({
          name: document.getElementById('itemName')?.value || '',
          code: document.getElementById('itemCode')?.value || '',
          client: document.getElementById('clientName')?.value || '',
          stage: document.getElementById('stageSelect')?.value || 'Preparo do Material',
          priority: document.getElementById('prioritySelect')?.value || 'Média'
        });
        closeModal();
        form.reset();
      });
    }

    loadData();
    setInterval(loadData, 3000);
  });
</script>
